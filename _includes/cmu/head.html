<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {%- assign summary = page.description | default: site.description %}
  {%- if summary %}
  <meta name="description" content="{{ summary | strip_html | escape }}">
  {%- endif %}
  <title>{% unless home %}{{ page.title }} - {% endunless %}{{ site.title }} - Carnegie Mellon University</title>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,400italic,300italic,300,700,700italic" rel="stylesheet">
  <link href="{{ tpl }}/css/main.6.7.min.css" media="screen" rel="stylesheet">
  <link href="{{ tpl }}/css/print.min.css" media="print" rel="stylesheet">
  <link href="{{ kitcdn }}/css/cmu-cms.css" rel="stylesheet">
  <link href="https://www.cmu.edu/favicon.ico" rel="icon">
  <link href="https://www.cmu.edu/favicon-152.png" rel="apple-touch-icon-precomposed">
  <meta content="#9f0000" name="msapplication-TileColor">
  <meta content="https://www.cmu.edu/favicon-144.png" name="msapplication-TileImage">
</head>
